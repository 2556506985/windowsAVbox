[package]
name = "webhtv-desktop"
version = "0.1.0"
description = "Windows desktop client for WebHomeTV"
authors = ["WebHomeTV Desktop contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "webhtv_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
libloading = "0.8.8"
percent-encoding = "2.3.2"
regex = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "gzip", "brotli", "deflate", "blocking"] }
rquickjs = { version = "=0.12.1", features = ["loader"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
zip = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
